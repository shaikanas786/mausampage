<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mausam Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topbar">
        <h1>⚙️ Mausam Admin</h1>
        <button id="logoutButton" class="secondary-button">
            Logout
        </button>
    </header>

    <main class="container">
        <h2>Registered Users</h2>

        <table id="usersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

    <script src="js/admin.js"></script>
</body>
</html>
